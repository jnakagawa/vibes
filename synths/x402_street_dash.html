<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>402SB — 100-Second Street Dash</title>
<meta name="description" content="A $100 → $1,000 x402 fund mandate, live P&L replayed in 100 seconds.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f14;--card:#12161d;--line:#212733;--txt:#eceef1;--dim:#8b929e;--up:#00c805;--dn:#ff5000;--acc:#c5ff3e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Manrope',-apple-system,sans-serif;
  font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums;overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.stage{width:480px;height:480px;max-width:100vw;max-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);padding:14px 16px 12px}
.hdr{display:flex;align-items:flex-start;gap:10px}
.logo{font-weight:800;font-size:15px}.logo span{color:var(--acc)}
.logo small{display:block;color:var(--dim);font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:-1px}
.proto{margin-left:auto;color:#07110a;background:var(--acc);border-radius:999px;padding:3px 10px;
  font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;align-self:center}
.nav{display:flex;align-items:flex-end;gap:14px;margin:10px 0 4px}
.nav .v{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.nav .delta{font-weight:700;font-size:13px;padding-bottom:2px}
.nav .right{margin-left:auto;text-align:right;padding-bottom:2px}
.ohlc{font-size:10.5px;color:var(--dim)}.ohlc b{color:var(--txt);font-weight:600}
.day{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.up{color:var(--up)}.dn{color:var(--dn)}.dim{color:var(--dim)}
.chartwrap{flex:1;position:relative;margin-top:2px}
svg{display:block;width:100%;height:100%}
.grid{stroke:#1a202a;stroke-width:1}
.charter{stroke:#3a4354;stroke-width:1;stroke-dasharray:2 4}
.ax{fill:var(--dim);font-size:9.5px;font-family:Manrope,sans-serif}
.axl{fill:#0c0f14;font-size:9.5px;font-weight:700;font-family:Manrope,sans-serif}
.dlab{fill:var(--dim);font-size:8.5px;font-weight:600;font-family:Manrope,sans-serif;text-anchor:middle}
.lastline{stroke:#3a4354;stroke-width:1;stroke-dasharray:2 4}
.lastchip{fill:var(--acc)}
.wick.u,.body.u{stroke:var(--up)}.wick.d,.body.d{stroke:var(--dn)}
.body.u{fill:var(--up)}.body.d{fill:var(--dn)}
.vol.u{fill:#0f3f16}.vol.d{fill:#4a1c09}
.mkr{font-size:8.5px;font-weight:800;font-family:Manrope,sans-serif;text-anchor:middle}
.mkr.buy,.mkr.perp{fill:var(--up)}.mkr.sell,.mkr.close{fill:var(--dn)}
.mkr.perp{fill:var(--acc)}
.flash{position:absolute;left:0;top:2px;background:#181d26;border:1px solid #2a3140;border-radius:8px;
  padding:5px 10px;font-size:10.5px;font-weight:800;letter-spacing:.03em;box-shadow:0 6px 18px rgba(0,0,0,.5);
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.flash.on{opacity:1}
.flash .g{margin-right:5px}
.foot{display:flex;align-items:center;gap:10px;margin-top:8px}
.bar{flex:1;height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0%;background:var(--acc);border-radius:999px}
.clockl{font-size:10.5px;font-weight:700;color:var(--dim);min-width:74px;text-align:right}
.cap{font-size:9.5px;color:var(--dim);margin-top:5px;display:flex;justify-content:space-between}
.endpill{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(6px);
  background:var(--acc);color:#07110a;font-weight:800;font-size:12px;letter-spacing:.04em;
  padding:7px 16px;border-radius:999px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,.5)}
.endpill.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<div class="stage">
  <div class="hdr">
    <div class="logo">402nd <span>Street Bets</span><small>100-second street dash</small></div>
    <div class="proto">x402 fund</div>
  </div>
  <div class="nav">
    <div class="v" id="nav">$101.00</div>
    <div class="delta dim" id="delta">— flat</div>
    <div class="right">
      <div class="day" id="day">Day 14/30</div>
      <div class="ohlc" id="ohlc">O <b>—</b> H <b>—</b> L <b>—</b> C <b>—</b></div>
    </div>
  </div>
  <div class="chartwrap">
    <svg id="chart" viewBox="0 0 448 300" preserveAspectRatio="none"></svg>
    <div class="flash" id="flash"></div>
    <div class="endpill" id="endpill">↻ RUN IT BACK</div>
  </div>
  <div class="foot">
    <div class="bar"><i id="barfill"></i></div>
    <div class="clockl" id="clockl">0s / 100s</div>
  </div>
  <div class="cap">
    <span id="capl">NAV daily candles · x402 cloud harness</span>
    <span>target $1,000 by Sep 4</span>
  </div>
</div>
<script>
// ---- baked fallback: wsad-cloud-harness-v15 snapshot, 2026-08-20 13:18 PDT ----
// candles [dateLabel, o, h, l, c, volUSD]; marks [dateLabel, kind, flashText]
const SNAP={
 updated:'2026-08-20 13:18 PDT', day:'14/30',
 candles:[
  ['8/5',101.00,101.00,101.00,101.00,4],
  ['8/6',101.00,101.00,99.97,99.97,18],
  ['8/7',100.08,100.08,100.08,100.08,0],
  ['8/8',101.06,101.43,101.06,101.37,30],
  ['8/10',98.37,102.13,98.37,100.99,0],
  ['8/11',100.14,117.78,98.84,105.49,0],
  ['8/12',105.81,110.09,93.79,93.91,0],
  ['8/13',93.88,95.12,93.88,94.72,0],
  ['8/14',94.82,95.48,94.20,94.20,0],
  ['8/15',94.27,94.69,94.27,94.68,0],
  ['8/18',89.81,90.09,89.37,89.38,0],
  ['8/19',89.79,91.35,88.93,90.80,0],
  ['8/20',90.93,90.93,88.82,88.82,0]],
 marks:[
  ['8/5','sell','SHAKEOUT · NVDAx $4 round-trip'],
  ['8/6','buy','BUY METAx $18'],
  ['8/6','perp','YOLO · 5x LONG META'],
  ['8/8','buy','BUY AAPLx + TSLAx $30'],
  ['8/8','perp','YOLO · 20x CRANK META'],
  ['8/12','close','YOLO · CLOSE META LONG'],
  ['8/13','perp','YOLO · OPEN LONG NVDA'],
  ['8/20','close','YOLO · CLOSE NVDA LONG']]
};
const HARNESS='https://wsad-cloud-harness-v15.app.withzero.ai/';
const BASE=100, TOTAL=100;

// ---- live parse of the harness dashboard (same-format data attrs) ----
function parseLive(h){
  const candles=[...h.matchAll(/data-d="\d{4}-(\d\d)-(\d\d)"[^>]*data-o="([\d.]+)"[^>]*data-h="([\d.]+)"[^>]*data-l="([\d.]+)"[^>]*data-c="([\d.]+)"[^>]*data-v="([\d.]+)"/g)]
    .map(m=>[`${+m[1]}/${+m[2]}`,+m[3],+m[4],+m[5],+m[6],+m[7]]);
  if(candles.length<2) throw new Error('no candles');
  const marks=[];
  h.split('<tr>').forEach(row=>{
    const m=row.match(/<td class="sym">(\w+)<\/td><td><span class="chip[^"]*">Filled<\/span><\/td><td class="[^"]*">([^<]+)<\/td><td class="dim">([^<]*)<\/td>/);
    const d=row.match(/class="rt dim">(\d\d)-(\d\d) [\d:]+ PDT<\/td>/);
    if(!m||!d) return;
    const side=m[2], perp=/perp/.test(m[3]);
    const kind=/^Buy/.test(side)?'buy':/^Sell/.test(side)?'sell':/^Open/.test(side)?'perp':'close';
    marks.push([`${+d[1]}/${+d[2]}`,kind,(perp?'YOLO · ':'')+side.toUpperCase()+' '+m[1]]);
  });
  marks.reverse();
  const upd=h.match(/updated (\d{4}-\d\d-\d\d \d\d:\d\d P[DS]T)/);
  const day=h.match(/Day<\/span><b>([^<]+)<\/b>/);
  return {updated:upd?upd[1]:'',day:day?day[1].replace(/\s/g,''):'',candles,marks,live:true};
}

// ---- replay engine (N candles → 100s) ----
let D=SNAP, SLOT, KEYS, dom, maxVol;
const W=448,H=300,PLOT_W=396,VOL_H=18,LBL_H=13,PRICE_H=H-VOL_H-LBL_H-6;
let CW,BODY;
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const yP=v=>PRICE_H*(1-(v-dom[0])/(dom[1]-dom[0]));

function prep(){
  const n=D.candles.length; SLOT=TOTAL/n;
  CW=PLOT_W/n; BODY=Math.min(CW*0.58,20);
  let lo=Infinity,hi=-Infinity;
  D.candles.forEach(c=>{lo=Math.min(lo,c[3]);hi=Math.max(hi,c[2])});
  const pad=(hi-lo)*0.05+0.2; dom=[lo-pad,hi+pad];
  maxVol=Math.max(...D.candles.map(c=>c[5]),1);
  // per-candle sweep waypoints at fixed intra-slot times: O → first extreme → second → C
  KEYS=D.candles.map((c,i)=>{
    const [,o,h,l,cl]=c, up=cl>=o;
    const path=up?[o,l,h,cl]:[o,h,l,cl];
    return {t0:i*SLOT, pts:[[.15,path[0]],[.38,path[1]],[.68,path[2]],[.92,path[3]]]};
  });
  // marks → absolute times, staggered within their day's slot
  const perDay={};
  D.marksT=D.marks.filter(m=>D.candles.some(c=>c[0]===m[0])).map(m=>{
    const di=D.candles.findIndex(c=>c[0]===m[0]);
    const lane=perDay[m[0]]=(perDay[m[0]]||0)+1;
    return {di,lane:lane-1,t:di*SLOT+(0.25+(lane-1)*0.22)*SLOT,kind:m[1],txt:m[2]};
  });
}

function sweep(i,rel){ // value of candle i's sweep at intra-slot rel
  const p=KEYS[i].pts;
  if(rel<=p[0][0]) return p[0][1];
  for(let k=1;k<p.length;k++) if(rel<=p[k][0]){
    const a=p[k-1],b=p[k];
    return a[1]+(b[1]-a[1])*ease((rel-a[0])/(b[0]-a[0]));
  }
  return p[p.length-1][1];
}
function navAt(t){
  const n=D.candles.length;
  if(t>=TOTAL) return D.candles[n-1][4];
  const i=Math.min(Math.floor(t/SLOT),n-1), rel=t/SLOT-i;
  if(rel<0.15) return i===0?D.candles[0][1]:D.candles[i-1][4];
  return sweep(i,rel);
}
function candleAt(i,t){
  const c=D.candles[i], s=i*SLOT, rel=(t-s)/SLOT;
  if(rel<=0.15) return null;
  if(rel>=1) return {o:c[1],h:c[2],l:c[3],c:c[4],prog:1};
  const seen=[c[1]];
  KEYS[i].pts.forEach(p=>{if(rel>=p[0])seen.push(p[1])});
  const cur=sweep(i,rel); seen.push(cur);
  return {o:c[1],c:cur,h:Math.max(...seen),l:Math.min(...seen),prog:rel};
}

const svg=document.getElementById('chart');
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
const GLYPH={buy:'▲',sell:'▼',perp:'◆',close:'✕'};

function render(t){
  let out='';
  const span=dom[1]-dom[0], step=span>15?10:span>6?2:0.5;
  for(let v=Math.ceil(dom[0]/step)*step;v<dom[1];v+=step){
    const y=yP(v).toFixed(1);
    out+=`<line x1="0" y1="${y}" x2="${PLOT_W}" y2="${y}" class="grid"/>`;
    out+=`<text x="${PLOT_W+4}" y="${(+y+3.2).toFixed(1)}" class="ax">${v.toFixed(0)}</text>`;
  }
  if(dom[0]<BASE&&BASE<dom[1]){
    const y=yP(BASE).toFixed(1);
    out+=`<line x1="0" y1="${y}" x2="${PLOT_W}" y2="${y}" class="charter"/>`;
  }
  const nav=navAt(t);
  for(let i=0;i<D.candles.length;i++){
    const cx=i*CW+CW/2;
    out+=`<text x="${cx.toFixed(1)}" y="${H-3}" class="dlab">${D.candles[i][0]}</text>`;
    const c=candleAt(i,t);
    if(!c) continue;
    const up=c.c>=c.o, cls=up?'u':'d';
    const yO=yP(c.o), yC=yP(c.c);
    const bt=Math.min(yO,yC), bh=Math.max(Math.abs(yO-yC),1.5);
    out+=`<line x1="${cx.toFixed(1)}" y1="${yP(c.h).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${yP(c.l).toFixed(1)}" class="wick ${cls}"/>`;
    out+=`<rect x="${(cx-BODY/2).toFixed(1)}" y="${bt.toFixed(1)}" width="${BODY.toFixed(1)}" height="${bh.toFixed(1)}" rx="1" class="body ${cls}"/>`;
    const vh=(D.candles[i][5]/maxVol)*VOL_H*c.prog;
    if(vh>0.5) out+=`<rect x="${(cx-BODY/2).toFixed(1)}" y="${(PRICE_H+VOL_H-vh+4).toFixed(1)}" width="${BODY.toFixed(1)}" height="${vh.toFixed(1)}" rx="1" class="vol ${cls}"/>`;
  }
  // trade glyphs stack above each day's high as the clock passes them
  D.marksT.forEach(m=>{
    if(m.t>t) return;
    const cx=m.di*CW+CW/2, hi=D.candles[m.di][2];
    const my=Math.max(yP(hi)-8-m.lane*10,8);
    out+=`<text x="${cx.toFixed(1)}" y="${my.toFixed(1)}" class="mkr ${m.kind}">${GLYPH[m.kind]}</text>`;
  });
  const ly=yP(nav);
  out+=`<line x1="0" y1="${ly.toFixed(1)}" x2="${PLOT_W}" y2="${ly.toFixed(1)}" class="lastline"/>`;
  out+=`<rect x="${PLOT_W}" y="${(ly-7.5).toFixed(1)}" width="50" height="15" rx="2" class="lastchip"/>`;
  out+=`<text x="${PLOT_W+25}" y="${(ly+3.6).toFixed(1)}" class="axl" text-anchor="middle">${nav.toFixed(2)}</text>`;
  svg.innerHTML=out;
  // counters
  const pl=nav-BASE, up=pl>=0;
  $('nav').textContent='$'+nav.toFixed(2);
  const de=$('delta');
  de.textContent=(up?'▲ +':'▼ −')+'$'+Math.abs(pl).toFixed(2)+' ('+(up?'+':'−')+Math.abs(pl/BASE*100).toFixed(2)+'%)';
  de.className='delta '+(up?'up':'dn');
  const di=Math.min(Math.floor(t/SLOT),D.candles.length-1);
  const cc=candleAt(di,t)||{o:navAt(t),h:navAt(t),l:navAt(t),c:navAt(t)};
  $('ohlc').innerHTML=`Aug ${D.candles[di][0].split('/')[1]} · O <b>${cc.o.toFixed(2)}</b> H <b>${cc.h.toFixed(2)}</b> L <b>${cc.l.toFixed(2)}</b> C <b>${cc.c.toFixed(2)}</b>`;
  // event flash: latest mark within the last 3.5s
  const fl=$('flash');
  const act=D.marksT.filter(m=>m.t<=t&&t-m.t<3.5).pop();
  if(act&&t<TOTAL){fl.innerHTML=`<span class="g ${act.kind==='close'||act.kind==='sell'?'dn':act.kind==='perp'?'':'up'}">${GLYPH[act.kind]}</span>${esc(act.txt)}`;fl.classList.add('on')}
  else fl.classList.remove('on');
  $('barfill').style.width=Math.min(t/TOTAL*100,100)+'%';
  $('clockl').textContent=Math.min(Math.floor(t),TOTAL)+'s / '+TOTAL+'s';
  $('endpill').classList.toggle('on',t>=TOTAL);
}

// ---- boot: try live data (2.5s budget), fall back to baked snapshot ----
const q=new URLSearchParams(location.search);
let start,done=false;
function tick(now){
  const t=(now-start)/1000;
  render(Math.min(t,TOTAL));
  if(t>=TOTAL){done=true;return}
  requestAnimationFrame(tick);
}
function boot(){
  prep();
  $('day').textContent='Day '+(D.day||SNAP.day);
  $('capl').textContent='NAV daily candles · '+(D.live?'live':'snapshot')+' · upd '+(D.updated||SNAP.updated).replace('2026-','');
  start=performance.now()-(q.has('poster')?TOTAL:(parseFloat(q.get('t'))||0))*1000;
  requestAnimationFrame(tick);
}
document.body.addEventListener('pointerdown',()=>{
  start=performance.now();
  if(done){done=false;requestAnimationFrame(tick)}
});
if(q.has('poster')||q.get('live')==='0') boot();
else Promise.race([
  fetch(HARNESS).then(r=>r.text()).then(parseLive),
  new Promise((_,rej)=>setTimeout(rej,2500,'timeout'))
]).then(d=>{D=d}).catch(()=>{}).then(boot);
</script>
</body></html>
